# Free scheduled paper-trading cycles (Polymarket + Smarkets) on GitHub's hosted runners.
# It never trades live: PM_MODE is forced to paper here. State and digests are committed back
# to the vault so the calibration record grows even when your machine is off.
name: prediction-paper-scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)

permissions:
  contents: write

concurrency:
  group: polymarket-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PM_MODE: paper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        working-directory: polymarket
        run: python -m unittest discover -s tests
      - name: Polymarket paper scan (free signal source + calibration)
        working-directory: polymarket
        run: python run.py scan --digest --max-events 200
      - name: Smarkets paper scan (UK-licensed venue)
        working-directory: polymarket
        run: python run.py --config config.smarkets.json scan --digest
      - name: Commit state back to the vault
        run: |
          git config user.name "polymarket-bot"
          git config user.email "polymarket-bot@users.noreply.github.com"
          git add polymarket/state polymarket/digests
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "polymarket: paper scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
